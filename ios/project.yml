name: NikaidoMirror
options:
  bundleIdPrefix: org.nikaido
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  NikaidoMirror:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nikaido Mirror
        CFBundleShortVersionString: '0.1.2'
        CFBundleVersion: '2'
        UILaunchScreen: {}
        UIBackgroundModes: [screen-capture]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nikaido.mirror
    scheme:
      gatherCoverageData: false
